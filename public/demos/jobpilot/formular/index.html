<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>JobPilot – synthetisches Übungsformular</title>
    <style>
      body {
        margin: 0;
        padding: 22px;
        font: 13px/1.5 system-ui;
        color: #223553;
        background: #f7faff;
      }
      h2 {
        font-size: 19px;
        margin: 0 0 8px;
      }
      p {
        color: #61748f;
      }
      form {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
      }
      label {
        display: grid;
        gap: 5px;
      }
      input,
      select {
        min-width: 0;
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        border: 1px solid #d0dcf0;
        border-radius: 5px;
        background: white;
        font: 13px system-ui;
      }
      .breit {
        grid-column: 1/-1;
      }
      .zustimmung {
        display: flex;
        align-items: center;
      }
      .zustimmung input {
        width: auto;
      }
      button {
        padding: 10px;
        background: #165dff;
        color: white;
        border: 0;
        border-radius: 5px;
      }
      #status {
        font-size: 11px;
      }
      @media (max-width: 450px) {
        form {
          grid-template-columns: 1fr;
        }
      }
      *:focus-visible {
        outline: 2px solid #165dff;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <h2>Ein Formular, zwei Durchläufe.</h2>
    <p>Fiktive Felder. Es gibt hier keinen Versand.</p>
    <form id="uebung">
      <label>Vorname<input name="firstName" autocomplete="off" /></label
      ><label>Nachname<input name="lastName" autocomplete="off" /></label
      ><label
        >E-Mail<input type="email" name="email" autocomplete="off" /></label
      ><label>Wohnort<input name="city" autocomplete="off" /></label>
      <div class="breit">
        <label for="quelle">Wie haben Sie von uns gehört?</label
        ><select name="quelle" id="quelle">
          <option value="">Bitte wählen</option>
          <option>StepStone</option>
          <option>Empfehlung</option>
        </select>
      </div>
      <label class="breit zustimmung"
        ><input type="checkbox" name="consent" />Ich möchte in den Talentpool
        aufgenommen werden.</label
      >
    </form>
    <p id="status" role="status">Warten auf den ersten Durchlauf.</p>
    <script src="../erweiterung/fields.js"></script>
  </body>
</html>
